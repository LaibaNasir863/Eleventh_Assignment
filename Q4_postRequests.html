
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request Practice</title>
    <link rel="stylesheet" href="Q4_postRequests.css">
</head>
<body>

    <header>
        <h1>API Request Practice</h1>
        <p>Create and Update an Announcement</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Create a Post</h2>

            <form id="post-form">
                <label for="title">Title:</label>
                <input type="text" id="title" required>

                <label for="content">Content:</label>
                <textarea id="content" required></textarea>

                <label for="userId">User ID:</label>
                <input type="number" id="userId" min="1" value="1" required>

                <button type="submit">Create Post (POST)</button>
            </form>
        </section>

        <section class="actions-section">
            <h2>Update and Delete a Post</h2>

            <button id="put-btn">Replace Post (PUT)</button>
            <button id="patch-btn">Update Title (PATCH)</button>
            <button id="delete-btn">Delete Post (DELETE)</button>
        </section>

        <section class="result-section">
            <h2>API Response</h2>
            <p id="message">Submit the form or select an action.</p>
            <pre id="result">Response will appear here...</pre>
        </section>
    </main>

    <script src="Q4_postRequests.js"></script>
</body>
</html>
