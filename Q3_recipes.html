
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="Q3_recipes.css">
</head>
<body>

    <header>
        <h1>Recipe Finder</h1>
        <p>Discover delicious meals and find your next recipe!</p>
    </header>

    <main>
        <h2>Explore Recipes</h2>

        <p id="message">Loading recipes...</p>

        <div id="recipes-container" class="recipes-container"></div>

        <div id="recipe-details" class="recipe-details">
            <h2>Recipe Ingredients</h2>
            <p>Select a recipe to see its ingredients.</p>
        </div>
    </main>

    <script src="Q3_recipes.js"></script>
</body>
</html>
